<!DOCTYPE html>
<html>
<head>
    <title>Tamal Student Registration</title>
</head>
<body>

<h1>Student Registration Form</h1>
<hr>

<h3>Created By: Md. Tawfiqul Islam Tamal (23-52978-3)</h3>
<hr>

<form action="#" method="post">

<label for="name">Full Name:</label>
<br>
<input type="text" id="name" name="name" placeholder="Enter name" required>
<br>
<br>

<label for="email">Email Address:</label>
<br>
<input type="email" id="email" name="email" placeholder="Enter email address" required>
<br>
<br>

<label for="pass">Password:</label>
<br>
<input type="password" id="pass" name="password" required>
<br>

<br>

<hr>

<label>Gender:</label>
<br>
<input type="radio" id="male" name="gender" value="Male" required>
<label for="male">Male</label>

<input type="radio" id="female" name="gender" value="Female">
<label for="female">Female</label>
<br>
<br>

<hr>

<label>Skills:</label>
<br>
<input type="checkbox" id="html" name="skills" value="HTML">
<label for="html">HTML</label>

<input type="checkbox" id="css" name="skills" value="CSS">
<label for="css">CSS</label>

<input type="checkbox" id="js" name="skills" value="JavaScript">
<label for="js">JavaScript</label>

<input type="checkbox" id="python" name="skills" value="Python">
<label for="python">Python</label>

<input type="checkbox" id="csharp" name="skills" value="C#">
<label for="csharp">C#</label>

<input type="checkbox" id="php" name="skills" value="PHP">
<label for="php">PHP</label>
<br>
<br>

<hr>

<label for="dept">Department:</label>
<br>
<select id="dept" name="department" required>
    <option value="">Select Department</option>
    <option value="CSE">CSE</option>
    <option value="EEE">EEE</option>
    <option value="BBA">BBA</option>
</select>
<br>
<br>

<hr>

<label for="msg">Message:</label>
<br>
<textarea id="msg" name="message" rows="3" cols="30" placeholder="Write message"></textarea>
<br>
<br>

<input type="submit" value="Submit">

</form>

<hr>

<footer>
    <p>© 2026 Student Registration | Created by Md. Tawfiqul Islam Tamal (23-52978-3)</p>
</footer>

</body>
</html>
